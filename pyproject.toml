[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meshcore-flasher"
version = "0.1.0"
description = "Desktop and command-line flasher for MeshCore devices"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "esptool>=4.7,<5",
  "pyserial>=3.5,<4",
]

[project.scripts]
meshcore-flasher = "meshcore_flasher.gui:main"
meshcore-flash = "meshcore_flasher.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
